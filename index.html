<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
  <title>mondoo.ly</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #000000;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
    }

    .mondoo-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #000000;
    }

    .mondoo-background {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .mondoo-brand {
      position: absolute;
      left: 50%;
      top: 46%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .mondoo-logo {
      display: block;
      width: clamp(58px, 5.2vw, 78px);
      height: auto;
      flex: 0 0 auto;
      overflow: visible;
    }

    .mondoo-wordmark-window {
      position: relative;
      width: clamp(138px, 13vw, 178px);
      height: clamp(44px, 4vw, 58px);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .mondoo-wordmark {
      position: absolute;
      left: 0;
      top: 21px;
      color: #f7f7f7;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(30px, 3vw, 44px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.055em;
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .mondoo-wordmark--mondoo {
      animation: word-up-mondoo 6s cubic-bezier(0.76, 0, 0.24, 1) infinite;
    }

    .mondoo-wordmark--business {
      animation: word-up-business 6s cubic-bezier(0.76, 0, 0.24, 1) infinite;
    }

    @keyframes word-up-mondoo {
      0%, 35% {
        transform: translateY(0);
        opacity: 1;
      }

      45%, 85% {
        transform: translateY(-145%);
        opacity: 0;
      }

      86%, 99% {
        transform: translateY(145%);
        opacity: 0;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes word-up-business {
      0%, 39% {
        transform: translateY(145%);
        opacity: 0;
      }

      49%, 84% {
        transform: translateY(0);
        opacity: 1;
      }

      94%, 100% {
        transform: translateY(-145%);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .mondoo-logo {
        width: 54px;
      }

      .mondoo-wordmark-window {
        width: 116px;
        height: 43px;
      }

      .mondoo-wordmark {
        top: 21px;
        font-size: 29px;
      }
    }

    @media (max-height: 500px) {
      .mondoo-logo {
        width: 48px;
      }

      .mondoo-wordmark-window {
        width: 104px;
        height: 39px;
      }

      .mondoo-wordmark {
        top: 21px;
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mondoo-wordmark--mondoo {
        animation: none;
        transform: translateY(0);
        opacity: 1;
      }

      .mondoo-wordmark--business {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="mondoo-stage" aria-label="mondoo.ly">
    <svg
      class="mondoo-background"
      viewBox="0 0 1440 900"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
    >
      <rect width="1440" height="900" fill="#000000" />
    </svg>

    <div class="mondoo-brand" role="img" aria-label="mondoo business">
      <svg
        class="mondoo-logo"
        viewBox="615 340 215 215"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
      >
        <path
          d="M643.956 544.085C662.709 551.218 691.956 515.101 709.282 463.415C726.607 411.73 725.45 364.048 706.696 356.915C687.943 349.782 658.696 385.899 641.37 437.585C624.045 489.27 625.202 536.952 643.956 544.085Z"
          fill="url(#logo-gradient-1)"
        />
        <path
          d="M714.854 544.362C731.194 550.576 756.009 521.1 770.281 478.524C784.553 435.948 782.876 396.396 766.537 390.181C750.198 383.966 725.382 413.443 711.111 456.018C696.839 498.594 698.515 538.147 714.854 544.362Z"
          fill="url(#logo-gradient-2)"
        />
        <path
          d="M772.39 544.624C784.537 549.244 802.356 529.203 812.192 499.862C822.027 470.521 820.154 442.99 808.007 438.371C795.861 433.751 778.042 453.791 768.206 483.132C758.371 512.473 760.244 540.004 772.39 544.624Z"
          fill="url(#logo-gradient-3)"
        />

        <defs>
          <linearGradient id="logo-gradient-1" x1="757.438" y1="381.602" x2="690.728" y2="556.994" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EE8036" />
            <stop offset="0.1" stop-color="#E8823B" />
            <stop offset="0.25" stop-color="#E38A4A" />
            <stop offset="0.4" stop-color="#DC9560" />
            <stop offset="0.55" stop-color="#D49C70" />
            <stop offset="0.68" stop-color="#CDA685" />
            <stop offset="0.8" stop-color="#C3B099" />
            <stop offset="0.92" stop-color="#B9B9AE" />
            <stop offset="1" stop-color="#AAC3C6" />
          </linearGradient>

          <linearGradient id="logo-gradient-2" x1="766.54" y1="359.163" x2="699.829" y2="534.555" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EE8036" />
            <stop offset="0.1" stop-color="#E8823B" />
            <stop offset="0.25" stop-color="#E38A4A" />
            <stop offset="0.4" stop-color="#DC9560" />
            <stop offset="0.55" stop-color="#D49C70" />
            <stop offset="0.68" stop-color="#CDA685" />
            <stop offset="0.8" stop-color="#C3B099" />
            <stop offset="0.92" stop-color="#B9B9AE" />
            <stop offset="1" stop-color="#AAC3C6" />
          </linearGradient>

          <linearGradient id="logo-gradient-3" x1="777.07" y1="342.842" x2="710.36" y2="518.233" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EE8036" />
            <stop offset="0.1" stop-color="#E8823B" />
            <stop offset="0.25" stop-color="#E38A4A" />
            <stop offset="0.4" stop-color="#DC9560" />
            <stop offset="0.55" stop-color="#D49C70" />
            <stop offset="0.68" stop-color="#CDA685" />
            <stop offset="0.8" stop-color="#C3B099" />
            <stop offset="0.92" stop-color="#B9B9AE" />
            <stop offset="1" stop-color="#AAC3C6" />
          </linearGradient>
        </defs>
      </svg>
      <span class="mondoo-wordmark-window" aria-hidden="true">
        <span class="mondoo-wordmark mondoo-wordmark--mondoo">mondoo</span>
        <span class="mondoo-wordmark mondoo-wordmark--business">business</span>
      </span>
    </div>
  </main>
</body>
</html>
