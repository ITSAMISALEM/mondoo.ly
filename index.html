<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Mondoo × THE32. One space, everything connected." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Mondoo × THE32</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050505;
    }

    body {
      color: #f7f7f7;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      background: #050505;
    }

    .hero {
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: appear 780ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .brands {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: clamp(15px, 3vw, 24px);
      max-width: 100%;
    }

    .brand-logo {
      display: block;
      width: clamp(58px, 8vw, 78px);
      height: clamp(58px, 8vw, 78px);
      object-fit: contain;
      flex: none;
    }

    .brand-logo--mondoo {
      filter: invert(1);
    }

    .brand-cross {
      color: #777;
      font-size: clamp(19px, 3vw, 24px);
      font-weight: 400;
      line-height: 1;
      user-select: none;
    }

    .tagline {
      margin: 23px 0 0;
      color: #929292;
      font-weight: 500;
      font-size: clamp(12px, 2.2vw, 14px);
      line-height: 1.7;
      letter-spacing: -.015em;
    }

    .rule {
      width: min(220px, 60vw);
      height: 1px;
      background: rgba(255, 255, 255, .13);
      margin-top: 30px;
    }

    .products {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      width: 100%;
    }

    .products-heading {
      margin: 0;
      color: #686868;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .21em;
      font-weight: 600;
    }

    .product {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      height: 38px;
      max-width: 100%;
      color: #ededed;
      font-size: clamp(19px, 3.4vw, 23px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.035em;
      transform: translateY(0);
      opacity: 1;
      filter: blur(0);
      transition: transform 260ms cubic-bezier(.4, 0, .2, 1), opacity 260ms ease, filter 260ms ease;
      will-change: transform, opacity, filter;
    }

    .product.is-exiting {
      transform: translateY(-12px);
      opacity: 0;
      filter: blur(2px);
    }

    .product.is-entering {
      transform: translateY(12px);
      opacity: 0;
      filter: blur(2px);
    }

    .product-icon {
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
      display: block;
      object-fit: contain;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 390px) {
      .stage { padding-inline: 12px; }
      .brands { gap: 14px; }
      .brand-logo { width: 58px; height: 58px; }
      .brand-cross { font-size: 20px; }
    }

    @media (max-height: 530px) and (min-width: 600px) {
      .stage { padding-block: 25px; }
      .tagline { margin-top: 15px; }
      .rule { margin-top: 17px; }
      .products { margin-top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero { animation: none; }
      .product { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="hero" aria-label="Mondoo and THE32 products">
      <div class="brands" aria-label="Mondoo and THE32">
        <img class="brand-logo brand-logo--mondoo" src="/mondoo-logo-black.svg" width="78" height="78" alt="Mondoo" />
        <span class="brand-cross" aria-hidden="true">×</span>
        <img class="brand-logo" src="/the32-logo-light.svg" width="78" height="78" alt="THE32" />
      </div>

      <p class="tagline">One space. Everything connected.</p>
      <div class="rule" aria-hidden="true"></div>

      <div class="products">
        <p class="products-heading">PRODUCTS</p>
        <div class="product" aria-label="Featured product: Inbox">
          <img class="product-icon" src="/product-icon-inbox.svg" width="23" height="23" alt="" aria-hidden="true" />
          <span class="product-name">Inbox</span>
        </div>
      </div>

    </section>
  </main>
  <script>
    (() => {
      const products = [
        { name: "Inbox", icon: "/product-icon-inbox.svg" },
        { name: "Docs", icon: "/the32-logo-light.svg" },
        { name: "Design", icon: "/the32-logo-light.svg" },
        { name: "Whiteboard", icon: "/the32-logo-light.svg" },
        { name: "Calendar", icon: "/product-icon-calendar.svg" },
        { name: "AI Agents", icon: "/product-icon-agents.svg" }
      ];

      const panel = document.querySelector(".product");
      const label = panel.querySelector(".product-name");
      const icon = panel.querySelector(".product-icon");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let current = 0;

      window.setInterval(() => {
        if (reducedMotion.matches || document.hidden) return;
        panel.classList.add("is-exiting");
        window.setTimeout(() => {
          current = (current + 1) % products.length;
          const product = products[current];
          label.textContent = product.name;
          icon.src = product.icon;
          panel.setAttribute("aria-label", "Featured product: " + product.name);
          panel.classList.remove("is-exiting");
          panel.classList.add("is-entering");
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => panel.classList.remove("is-entering"));
          });
        }, 260);
      }, 3700);
    })();
  </script>
</body>
</html>
