<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172D27">
  <meta name="description" content="Mondoo — a new space for work. Bring your ideas, people and projects together. Coming soon.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22810%20205%20290%20290%22%3E%3Crect%20x%3D%22810%22%20y%3D%22205%22%20width%3D%22290%22%20height%3D%22290%22%20rx%3D%2272.5%22%20fill%3D%22%23172D27%22%2F%3E%0A%3Ccircle%20cx%3D%22955%22%20cy%3D%22350%22%20r%3D%22101.953%22%20fill%3D%22%23DDF49A%22%2F%3E%0A%3Cpath%20d%3D%22M1019.08%20455.734L849.266%20285.919L839.654%20295.531L1009.47%20465.347Z%20M1003.06%20471.755L833.246%20301.94L823.634%20311.552L993.45%20481.368Z%20M987.042%20487.777L817.226%20317.96L807.613%20327.573L977.429%20497.388Z%22%20fill%3D%22%23172D27%22%2F%3E%3C%2Fsvg%3E">
  <title>Mondoo — A new space for work</title>
  <style>
    :root { color-scheme: dark; --forest: #172D27; --lime: #DDF49A; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--forest); color: var(--lime); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .stage { width: min(100%, 1600px); margin-inline: auto; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(28px, 5.3vw, 84px); gap: 48px; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .header-logo { display: block; width: 36px; height: 36px; flex: 0 0 36px; }

    .eyebrow { font-size: 11px; letter-spacing: .16em; font-weight: 600; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 9px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
    main { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: clamp(24px, 5vw, 80px); }
    h1 { margin: 0; font-size: clamp(48px, 7.1vw, 112px); line-height: .99; font-weight: 680; letter-spacing: -.065em; }
    .description { margin: 30px 0 0; max-width: 440px; font-size: clamp(17px, 1.75vw, 23px); line-height: 1.55; color: var(--lime); opacity: .85; }

    footer { border-top: 1px solid rgba(221, 244, 154, .22); padding-top: 22px; font-size: 12px; letter-spacing: .035em; }
    @media (max-width: 720px) {
      .stage { gap: 36px; }
      main { align-content: center; }

      h1 { font-size: clamp(48px, 10.5vw, 76px); }
      .description { margin-top: 20px; }
      footer { flex-wrap: wrap; }
    }
    @media (max-width: 340px) { .stage { padding: 22px; } h1 { font-size: 42px; } }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <svg class="header-logo" width="36" height="36" role="img" aria-label="Mondoo" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="853.047 248.047 203.906 203.906">
<circle cx="955" cy="350" r="101.953" fill="#DDF49A"/>
<path d="M1019.08 455.734L849.266 285.919L839.654 295.531L1009.47 465.347Z M1003.06 471.755L833.246 301.94L823.634 311.552L993.45 481.368Z M987.042 487.777L817.226 317.96L807.613 327.573L977.429 497.388Z" fill="#172D27"/></svg>
      <span class="eyebrow status">Coming soon</span>
    </header>
    <main>
      <div>
        <h1>A new space<br>for work.</h1>
        <p class="description">Bring your ideas, people and projects together. One space to create, organize and collaborate.</p>
      </div>
    </main>
    <footer>
      <span>Mondoo &copy; 2026</span>
      <span>Built for the way you work.</span>
    </footer>
  </div>
</body>
</html>
