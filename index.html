<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
  <title>mondoo.ly</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #000000;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
    }

    .mondoo-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #000000;
    }

    .mondoo-background {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .mondoo-brand {
      --logo-size: clamp(58px, 5.2vw, 78px);
      --word-size: clamp(30px, 3vw, 44px);
      position: absolute;
      left: 50%;
      top: 50%;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .mondoo-logo {
      display: block;
      width: var(--logo-size);
      height: auto;
      /* Keep the light-mode black asset visible on this dark landing page. */
      filter: invert(1);
      flex: 0 0 auto;
      overflow: visible;
    }

    .mondoo-divider {
      display: block;
      width: 2px;
      height: var(--logo-size);
      flex: 0 0 2px;
      color: rgba(255, 255, 255, 0.58);
    }

    /* An intrinsically sized wordmark keeps the complete lockup centered. */
    .mondoo-wordmark-window {
      position: relative;
      display: block;
      width: 112px;
      max-width: calc(100vw - var(--logo-size) - 48px);
      height: var(--logo-size);
      overflow: hidden;
      flex: 0 1 auto;
      transition: width 550ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mondoo-wordmark,
    .mondoo-wordmark-measure {
      position: absolute;
      left: 0;
      top: 50%;
      color: #f7f7f7;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: var(--word-size);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .mondoo-product {
      display: inline-flex;
      align-items: center;
      gap: clamp(7px, 1vw, 10px);
      white-space: nowrap;
    }

    .mondoo-product-icon {
      display: block;
      width: clamp(20px, 2vw, 26px);
      height: clamp(20px, 2vw, 26px);
      flex: 0 0 auto;
    }

    .mondoo-product-label,
    .mondoo-product-label-measure {
      display: inline-block;
    }

    .mondoo-wordmark {
      transform: translateY(-50%);
      opacity: 1;
      filter: blur(0);
      transition: opacity 240ms ease, transform 280ms cubic-bezier(0.4, 0, 0.2, 1), filter 240ms ease;
    }

    .mondoo-wordmark.is-exiting {
      transform: translateY(calc(-50% - 12px));
      opacity: 0;
      filter: blur(2px);
    }

    .mondoo-wordmark.is-entering {
      transform: translateY(calc(-50% + 12px));
      opacity: 0;
      filter: blur(2px);
    }

    .mondoo-wordmark-measure {
      width: max-content;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-50%);
    }

    @media (max-width: 640px) {
      .mondoo-brand {
        --logo-size: 54px;
        --word-size: 29px;
      }
    }

    @media (max-height: 500px) {
      .mondoo-brand {
        --logo-size: 48px;
        --word-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mondoo-wordmark-window,
      .mondoo-wordmark {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const products = [{"name":"Inbox","icon":"/product-icon-inbox.svg"},{"name":"Docs","icon":"/the32-logo-light.svg"},{"name":"Design","icon":"/the32-logo-light.svg"},{"name":"Whiteboard","icon":"/the32-logo-light.svg"},{"name":"Calendar","icon":"/product-icon-calendar.svg"},{"name":"AI Agents","icon":"/product-icon-agents.svg"}];
      const frame = document.querySelector(".mondoo-wordmark-window");
      const wordmark = document.querySelector(".mondoo-wordmark");
      const measure = document.querySelector(".mondoo-wordmark-measure");
      const label = document.querySelector(".mondoo-product-label");
      const measureLabel = document.querySelector(".mondoo-product-label-measure");
      const icon = wordmark.querySelector(".mondoo-product-icon");
      const measureIcon = measure.querySelector(".mondoo-product-icon");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let current = 0;

      // Measure the active label rather than reserving space for the longest.
      // Because .mondoo-brand anchors at 50%, the full logo/divider/text
      // composition remains centered as short and long labels alternate.
      const sizeFor = (product) => {
        measureLabel.textContent = product.name;
        measureIcon.src = product.icon;
        frame.style.width = Math.ceil(measure.getBoundingClientRect().width + 2) + "px";
      };

      sizeFor(products[current]);
      document.fonts.ready.then(() => sizeFor(products[current]));
      window.addEventListener("resize", () => sizeFor(products[current]));

      window.setInterval(() => {
        if (reduceMotion.matches || document.hidden) return;
        wordmark.classList.add("is-exiting");
        window.setTimeout(() => {
          current = (current + 1) % products.length;
          const product = products[current];
          label.textContent = product.name;
          icon.src = product.icon;
          sizeFor(product);
          wordmark.classList.remove("is-exiting");
          wordmark.classList.add("is-entering");
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => wordmark.classList.remove("is-entering"));
          });
        }, 280);
      }, 3700);
    })();
  </script>
