<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Mondoo — One space. Everything connected. Coming soon." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
  <title>Mondoo — Coming Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      color: #f7f7f7;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .mondoo-stage {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #000;
    }

    .mondoo-intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .mondoo-brand {
      --logo-size: clamp(60px, 6vw, 78px);
      --word-size: clamp(33px, 3.4vw, 44px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1vw, 12px);
      white-space: nowrap;
      animation: mondoo-arrive 800ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .mondoo-logo {
      display: block;
      width: var(--logo-size);
      height: var(--logo-size);
      flex: none;
      filter: invert(1);
    }

    .mondoo-divider {
      display: block;
      width: 1px;
      height: var(--logo-size);
      flex: 0 0 1px;
      color: rgba(255, 255, 255, .45);
    }

    .mondoo-wordmark {
      margin: 0;
      font-size: var(--word-size);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.055em;
      color: #f7f7f7;
    }

    .mondoo-tagline {
      margin: 22px 0 0;
      font-size: clamp(13px, 1.3vw, 15px);
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: -.015em;
      color: #999;
      animation: mondoo-arrive 900ms 130ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .mondoo-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      color: #868686;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .20em;
      line-height: 1;
      animation: mondoo-arrive 900ms 250ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .mondoo-status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #bdbdbd;
      animation: mondoo-breathe 3s ease-in-out infinite;
    }

    @keyframes mondoo-arrive {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes mondoo-breathe {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    @media (max-width: 360px) {
      .mondoo-brand {
        --logo-size: 54px;
        --word-size: 29px;
        gap: 8px;
      }

      .mondoo-tagline { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mondoo-brand, .mondoo-tagline, .mondoo-status, .mondoo-status-dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="mondoo-stage">
    <section class="mondoo-intro" aria-label="Mondoo coming soon">
      <div class="mondoo-brand">
        <img class="mondoo-logo" src="/mondoo-logo-black.svg" width="512" height="512" alt="" aria-hidden="true" />
        <svg class="mondoo-divider" viewBox="0 0 1 512" width="1" height="512" fill="none" aria-hidden="true" focusable="false">
          <path d="M0.5 0V512" stroke="currentColor" stroke-width="1" />
        </svg>
        <h1 class="mondoo-wordmark">mondoo</h1>
      </div>
      <p class="mondoo-tagline">One space. Everything connected.</p>
      <div class="mondoo-status" aria-label="Coming soon">
        <span class="mondoo-status-dot" aria-hidden="true"></span>
        <span>COMING SOON</span>
      </div>
    </section>
  </main>
</body>
</html>
