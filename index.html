<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
  <title>mondoo.ly</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #000000;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
    }

    .mondoo-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #000000;
    }

    .mondoo-background {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .mondoo-brand {
      --logo-size: clamp(58px, 5.2vw, 78px);
      --word-size: clamp(30px, 3vw, 44px);
      position: absolute;
      left: 50%;
      top: 46%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .mondoo-logo {
      display: block;
      width: var(--logo-size);
      height: auto;
      flex: 0 0 auto;
      overflow: visible;
    }

    .mondoo-logo--draw .draw-stroke-main,
    .mondoo-logo--draw .draw-stroke-ghost {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mondoo-logo--draw .draw-stroke-main {
      stroke-width: 12;
      opacity: 1;
    }

    .mondoo-logo--draw .draw-stroke-ghost {
      stroke-width: 9.5;
      opacity: 0.38;
    }

    .mondoo-logo--draw .p1-main,
    .mondoo-logo--draw .p1-ghost {
      stroke: url(#logo-gradient-1);
    }

    .mondoo-logo--draw .p2-main,
    .mondoo-logo--draw .p2-ghost {
      stroke: url(#logo-gradient-2);
    }

    .mondoo-logo--draw .p3-main,
    .mondoo-logo--draw .p3-ghost {
      stroke: url(#logo-gradient-3);
    }

    .mondoo-logo--draw .p1-ghost {
      transform: translate(1.5px, -0.8px);
    }

    .mondoo-logo--draw .p2-ghost {
      transform: translate(-1px, 1.1px);
    }

    .mondoo-logo--draw .p3-ghost {
      transform: translate(1.1px, 0.7px);
    }

    .mondoo-wordmark-window {
      position: relative;
      width: clamp(138px, 13vw, 178px);
      height: var(--logo-size);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .mondoo-wordmark {
      position: absolute;
      left: 0;
      top: calc((var(--logo-size) - var(--word-size)) / 2 + 14px);
      color: #f7f7f7;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: var(--word-size);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.055em;
      white-space: nowrap;
      will-change: transform, opacity, filter;
    }

    .mondoo-wordmark--mondoo {
      animation: word-reveal-mondoo 7s linear infinite;
    }

    .mondoo-wordmark--business {
      animation: word-reveal-business 7s linear infinite;
    }

    @keyframes word-reveal-mondoo {
      0%, 36% {
        transform: translateY(0) scale(1);
        opacity: 1;
        filter: blur(0);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      44% {
        transform: translateY(-118%) scale(0.985);
        opacity: 0;
        filter: blur(2px);
      }

      44.01%, 86% {
        transform: translateY(118%) scale(0.985);
        opacity: 0;
        filter: blur(2px);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      94%, 100% {
        transform: translateY(0) scale(1);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes word-reveal-business {
      0%, 36% {
        transform: translateY(118%) scale(0.985);
        opacity: 0;
        filter: blur(2px);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      44%, 86% {
        transform: translateY(0) scale(1);
        opacity: 1;
        filter: blur(0);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      94%, 100% {
        transform: translateY(-118%) scale(0.985);
        opacity: 0;
        filter: blur(2px);
      }
    }

    @media (max-width: 640px) {
      .mondoo-brand {
        --logo-size: 54px;
        --word-size: 29px;
      }

      .mondoo-wordmark-window {
        width: 116px;
      }
    }

    @media (max-height: 500px) {
      .mondoo-brand {
        --logo-size: 48px;
        --word-size: 26px;
      }

      .mondoo-wordmark-window {
        width: 104px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mondoo-wordmark--mondoo {
        animation: none;
        transform: translateY(0);
        opacity: 1;
      }

      .mondoo-wordmark--business {
        display: none;
      }
    }
  </style>
</head>

          <linearGradient id="logo-gradient-3" x1="777.07" y1="342.842" x2="710.36" y2="518.233" gradientUnits="userSpaceOnUse">

      </svg>
      <span class="mondoo-wordmark-window" aria-hidden="true">
        <span class="mondoo-wordmark mondoo-wordmark--mondoo">mondoo</span>

      </span>
    </div>
  </main>

</html>
